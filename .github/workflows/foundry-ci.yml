name: Foundry Integration CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/foundry-agent-settings-20261110]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - name: Lint Foundry integration code (legacy repository lint is tracked separately)
        run: bunx eslint src/lib/foundry-admin.functions.ts src/lib/foundry-live.functions.ts src/lib/foundry-training.functions.ts src/lib/foundry-transport.server.ts src/routes/admin.foundry.tsx src/routes/admin.training.tsx --rule 'prettier/prettier: off'
